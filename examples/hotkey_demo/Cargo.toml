[package]
name = "hotkey_demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Demonstrates gpui-global-hotkey: a system-wide shortcut that shows the window from the background"

[dependencies]
# The published GPUI Kit release supplies the application shell and the GPUI
# types. The global-hotkey crate must be built against the same GPUI, so the
# flavor features below select one GPUI for both.
gpui-kit = { version = "0.8", default-features = false }
gpui-global-hotkey = { path = "../..", default-features = false }

[features]
default = ["gpui-kit"]
# GPUI Kit's `gpui-pre` snapshot, the default backend.
gpui-kit = ["gpui-global-hotkey/gpui-kit"]
